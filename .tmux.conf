# Nice tmux config guides:
#
# https://unwiredcouch.com/2013/11/15/my-tmux-setup.html
# http://www.hamvocke.com/blog/a-guide-to-customizing-your-tmux-conf/
# http://danielallendeutsch.com/blog/16-using-tmux-properly.html

set -sg escape-time 1

# change prefix key sequence
unbind C-b
set -g prefix C-o

# start window numbering at 1 for easier switching
set -g base-index 1

# bind fast session switching
unbind S
bind S command-prompt "switch -t %1"

# enable mouse scolling
set -g mouse on

# listen to alerts from all windows
setw -g monitor-activity off
setw -g monitor-silence 0
set -g bell-action none

set-option -g status-interval 1
setw -g automatic-rename on

# Status bar config: git branch name + claude status
set -gq @current_command "#(~/.tmux/scripts/window-name.sh #{pane_current_path}) #{?#{==:#{@claude_status},?},#[fg=#{@thm_yellow}]#{@claude_status},#{?#{==:#{@claude_status},✓},#[fg=#{@thm_accent}]#{@claude_status},#{?#{==:#{@claude_status},…},#[fg=#{@thm_overlay1}]#{@claude_status},}}}"

# colors
set -gq @evergarden_style "spring"
run ~/.tmux/plugins/evergarden-tmux/evergarden.sh

set -g allow-rename off
setw -g automatic-rename off

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @custom_copy_command 'rcopy'
set -g @override_copy_command 'rcopy'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'

# Overrides of evergarden-tmux configurations.
set -gq @_wc_text "#[fg=#{@thm_accent},bg=#{@status_surface}] #{@current_command}"
set -g message-style "fg=#{@thm_crust},bg=#{@thm_accent}"
set -g message-command-style "fg=#{@thm_text},bg=#{@thm_crust}"
